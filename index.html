<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Node.js Web Polyfills</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			height: 100%;
			margin: 0;
			background: #1e1e1e;
		}

		#terminal {
			height: 100%;
			width: 100%;
		}
	</style>
</head>
<body>
	<div id="terminal"></div>

	<script type="module">
		/*
		 node node_modules/@wordpress/scripts/bin/wp-scripts.js build wp.js

		 npm install -g corepack
		 node /lib/node_modules/corepack/dist/corepack.js install -g yarn
		 node /lib/node_modules/corepack/dist/corepack.js use yarn
		 node /lib/node_modules/corepack/dist/yarnpkg.js add @wordpress/scripts@*

		 npm install -g yarn
		 node /lib/node_modules/yarn/bin/yarn.js add @wordpress/scripts

		 npm install -g pnpm
		 node /lib/node_modules/pnpm/bin/pnpm.cjs install @wordpress/scripts
		 # Cannot find module worker_threads

		 npm pack @wordpress/scripts
		 extract-targz /bin/wordpress-scripts-30.25.0.tgz /bin/wordpress-scripts

		 npm install @wordpress/scripts --omit=dev --omit=optional
		 node node_modules/@wordpress/scripts/bin/wp-scripts.js build wp.js
		 */
		import { Terminal } from 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm';
		import { runMain } from './client-boot.js';

		const globalFs = window.globalFs;
		const textDecoder = new TextDecoder();
		const PROMPT_SUFFIX = '$ ';

		
		function normalizeNewlines(text) {
			return text.replace(/\r?\n/g, '\r\n');
		}

		function coerceToString(chunk, encoding) {
			if (typeof chunk === 'string') {
				return chunk;
			}
			if (chunk instanceof ArrayBuffer) {
				return textDecoder.decode(new Uint8Array(chunk));
			}
			if (ArrayBuffer.isView(chunk)) {
				return textDecoder.decode(chunk);
			}
			if (chunk === undefined || chunk === null) {
				return '';
			}
			if (typeof chunk === 'object' && 'toString' in chunk) {
				return String(chunk);
			}
			return String(chunk ?? '');
		}

		class ProcessExitError extends Error {
			constructor(code = 0) {
				super(`Process exited with code ${code}`);
				this.name = 'ProcessExitError';
				this.code = code ?? 0;
			}
		}

	const CACHE_NAME = 'node-polyfill-fetch-cache-v1';
	const previousFetch = globalThis.fetch;
	
	globalThis.fetch = async (url, ...args) => {
		const originalUrl = url;
		if (typeof url === 'string' && url.startsWith('https://')) {
			url = `http://127.0.0.1:8043/php-cors-proxy/cors-proxy.php?${url}`;
		}

		// Create cache key from URL and relevant options
		const options = args[0] || {};
		const method = options.method || 'GET';

		// Only cache GET requests
		if (method === 'GET' && 'caches' in globalThis) {
			try {
				// Open the cache
				const cache = await caches.open(CACHE_NAME);
				
				// Check if we have a cached response
				const cachedResponse = await cache.match(url);
				if (cachedResponse) {
					// console.log('[Cache] Using cached response for:', originalUrl);
					return cachedResponse.clone();
				}

				// Make the actual fetch request
				const response = await previousFetch(url, ...args);

				// Cache successful GET responses
				if (response.ok) {
					// Clone the response before caching to allow the original to be consumed
					await cache.put(url, response.clone());
					// console.log('[Cache] Cached response for:', originalUrl);
				}

				return response;
			} catch (error) {
				console.warn('[Cache] Error using cache:', error);
				// Fall back to regular fetch if caching fails
				return await previousFetch(url, ...args);
			}
		}

		// For non-GET requests or if Cache API not available
		return await previousFetch(url, ...args);
	};
		
		async function setupFilesystemAndFetch() {
			const fs = globalFs;
			fs.mkdirSync('/home/user/.npm/_cacache', { recursive: true });
			if (!fs.existsSync('/.npm')) {
				fs.mkdirSync('/.npm');
			}
			fs.mkdirSync('/bin', { recursive: true });
			fs.mkdirSync('/tmp', { recursive: true });
			fs.mkdirSync('/bin/project', { recursive: true });
			if (!fs.existsSync('/bin/node')) {
				fs.writeFileSync('/bin/node', '', { mode: 0o755 });
			}

			if (!fs.existsSync('/bin/npm')) {
				const npmCodeResponse = await fetch('/npm/npm-single.js');
				const npmCode = await npmCodeResponse.text();
				fs.writeFileSync('/bin/npm', npmCode, { mode: 0o755 });
			}
			if (!fs.existsSync('/bin/default-input.js')) {
				const defaultInputResponse = await fetch('/npm/default-input.js');
				const defaultInputCode = await defaultInputResponse.text();
				fs.writeFileSync('/bin/default-input.js', defaultInputCode);
			}
			const packageJsonPath = '/bin/package.json';
			const requiredDependencies = {
				// webpack: '*',
				// 'webpack-cli': '*',
				// 'function-bind': '*',
				// 'ts-loader': '*',
				// typescript: '*',
				// react: '*',
				// 'react-dom': '*',
				// '@types/react': '*',
				// '@types/react-dom': '*',
				// '@types/node': '*',
			};
			let packageJson = {
				name: 'web-polyfills-app',
				version: '1.0.0',
				private: true,
				dependencies: {},
			};
			if (fs.existsSync(packageJsonPath)) {
				try {
					const existing = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'));
					if (existing && typeof existing === 'object') {
						packageJson = {
							...packageJson,
							...existing,
							dependencies: { ...existing.dependencies },
						};
					}
				} catch (error) {
					console.warn('Failed to parse existing package.json, recreating it.', error);
				}
			}
			if (!packageJson.dependencies || typeof packageJson.dependencies !== 'object') {
				packageJson.dependencies = {};
			}
			for (const [dep, version] of Object.entries(requiredDependencies)) {
				if (!(dep in packageJson.dependencies)) {
					packageJson.dependencies[dep] = version;
				}
			}
			fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`);
			const webpackConfigPath = '/bin/webpack.config.js';
			const webpackConfigContent = `module.exports = {
	entry: '/bin/typescript-react.tsx',
	output: {
		filename: 'typescript-react.js',
	},
	module: {
		rules: [
			{
				test: /\\.tsx?$/,
				use: 'ts-loader',
				exclude: /node_modules/,
			},
		],
	},
	resolve: {
		extensions: ['.tsx', '.ts', '.js'],
	},
};
`;
			let existingWebpackConfig = null;
			if (fs.existsSync(webpackConfigPath)) {
				existingWebpackConfig = fs.readFileSync(webpackConfigPath, 'utf8');
			}
			if (existingWebpackConfig !== webpackConfigContent) {
				fs.writeFileSync(webpackConfigPath, webpackConfigContent);
			}
			const tsconfigPath = '/bin/tsconfig.json';
			const tsconfigObject = {
				compilerOptions: {
					target: 'ES2018',
					module: 'ESNext',
					moduleResolution: 'Node',
					jsx: 'react',
					esModuleInterop: true,
					allowSyntheticDefaultImports: true,
					skipLibCheck: true,
					forceConsistentCasingInFileNames: true,
					isolatedModules: true,
					lib: ['DOM', 'DOM.Iterable', 'ESNext'],
					types: ['node', 'react', 'react-dom'],
				},
				include: ['./**/*.ts', './**/*.tsx'],
			};
			const tsconfigContent = `${JSON.stringify(tsconfigObject, null, 2)}\n`;
			if (!fs.existsSync(tsconfigPath) || fs.readFileSync(tsconfigPath, 'utf8') !== tsconfigContent) {
				fs.writeFileSync(tsconfigPath, tsconfigContent);
			}
			if (!fs.existsSync('/bin/hello.js')) {
				fs.writeFileSync('/bin/hello.js', "console.log('Hello, world!');\n");
			}
			if (!fs.existsSync('/bin/typescript-react.tsx')) {
				fs.writeFileSync('/bin/typescript-react.tsx', `
				const React = require('react');
				const ReactDOM = require('react-dom');
				ReactDOM.render(<h1>Hello, world!</h1>, document.getElementById('root'));
				`);
			}
			globalFs.mkdirSync('/bin', { recursive: true });
			globalFs.mkdirSync('/bin/cowsay', { recursive: true });
			if (!fs.existsSync('/bin/cowsay/package.json')) {
				fs.writeFileSync(
					'/bin/cowsay/package.json',
					JSON.stringify({
						name: 'cowsay',
						version: '1.0.0',
						private: true
					}, null, 2)
				);
				fs.writeFileSync(
					'/bin/cowsay/test.js',
					`const cowsay = require('cowsay');
					console.log(cowsay.say({
						text : "I'm a moooodule",
						e : "oO",
						T : "U "
					}));
`
				);
			}
			globalFs.mkdirSync('/node_modules/node-gyp/bin', { recursive: true });
			globalFs.writeFileSync('/node_modules/node-gyp/package.json', '{}');
			globalFs.writeFileSync('/node_modules/node-gyp/bin/node-gyp.js', '');
		}

		window.stableConsole = {
			log: console.log.bind(console),
			info: console.info.bind(console),
			warn: console.warn.bind(console),
			error: console.error.bind(console),
			trace: console.trace.bind(console),
		}

		await setupFilesystemAndFetch();

		class NodeRunner {
			constructor(shell) {
				this.shell = shell;
				this.fs = globalFs;
				this.active = false;
				this.stdinStream = null;
				this.currentRunToken = null;
			}

			isNodeCommand(command) {
				return command === 'node' || command === 'npm';
			}

			createTtyStreams(argv, runToken) {
				const streamModule = globalThis.coreModules?.stream;
				if (!streamModule) {
					throw new Error('stream module is not available');
				}
				const { Writable, Readable } = streamModule;
				const term = this.shell.term;
				const initialCols = term?.cols ?? 80;
				const initialRows = term?.rows ?? 24;
				const toString = (chunk, encoding) => coerceToString(chunk, encoding);

				class TerminalWriteStream extends Writable {
					constructor(fd, writer) {
						super({ decodeStrings: false });
						this.fd = fd;
						this.isTTY = true;
						this.columns = initialCols;
						this.rows = initialRows;
						this._writer = writer;
					}

					_write(chunk, encoding, callback) {
						try {
							this._writer(toString(chunk, encoding));
							callback();
						} catch (error) {
							callback(error);
						}
					}

					_emit(sequence) {
						if (sequence) {
							this._writer(sequence);
						}
					}

					cursorTo(x, y, callback) {
						let sequence = '';
						if (typeof y === 'number') {
							const row = Math.max(0, y) + 1;
							const col = typeof x === 'number' ? Math.max(0, x) + 1 : 1;
							sequence = `\u001b[${row};${col}H`;
						} else if (typeof x === 'number') {
							const col = Math.max(0, x) + 1;
							sequence = `\u001b[${col}G`;
						}
						this._emit(sequence);
						if (typeof callback === 'function') {
							callback();
						}
						return true;
					}

					moveCursor(dx, dy, callback) {
						if (dy) {
							const vertical = Math.abs(dy);
							const code = dy > 0 ? 'B' : 'A';
							this._emit(`\u001b[${vertical}${code}`);
						}
						if (dx) {
							const horizontal = Math.abs(dx);
							const code = dx > 0 ? 'C' : 'D';
							this._emit(`\u001b[${horizontal}${code}`);
						}
						if (typeof callback === 'function') {
							callback();
						}
						return true;
					}

					clearLine(dir, callback) {
						const map = { '-1': '\u001b[1K', '0': '\u001b[2K', '1': '\u001b[0K' };
						this._emit(map[dir] ?? '\u001b[2K');
						if (typeof callback === 'function') {
							callback();
						}
						return true;
					}

					clearScreenDown(callback) {
						this._emit('\u001b[0J');
						if (typeof callback === 'function') {
							callback();
						}
						return true;
					}

					getColorDepth() {
						return 24;
					}

					hasColors() {
						return true;
					}

					getWindowSize() {
						return [this.columns, this.rows];
					}

					updateWindowSize(cols, rows) {
						if (typeof cols === 'number') {
							this.columns = cols;
						}
						if (typeof rows === 'number') {
							this.rows = rows;
						}
						this.emit('resize');
					}
				}

				class TerminalReadStream extends Readable {
					constructor() {
						super({ read() {} });
						this.fd = 0;
						this.isTTY = true;
						this.isRaw = false;
						this.columns = initialCols;
						this.rows = initialRows;
					}

					setRawMode(flag) {
						this.isRaw = !!flag;
						return this;
					}

					updateWindowSize(cols, rows) {
						if (typeof cols === 'number') {
							this.columns = cols;
						}
						if (typeof rows === 'number') {
							this.rows = rows;
						}
						this.emit('resize');
					}

					writeFromTerminal(data) {
						if (!this.push(data)) {
							// Drop data under backpressure; interactive input is best-effort.
						}
					}

					endOfInput() {
						this.push(null);
					}

					resume() {
						super.resume();
						return this;
					}

					pause() {
						super.pause();
						return this;
					}
				}

				const stdout = new TerminalWriteStream(1, (text) => this.shell.writeStdoutForRun(runToken, text));
				const stderr = new TerminalWriteStream(2, (text) => this.shell.writeStderrForRun(runToken, text));
				const stdin = new TerminalReadStream();

				const ttyModule = globalThis.coreModules?.tty;
				if (ttyModule && typeof ttyModule.isatty === 'function') {
					if (!ttyModule.__webPolyfillsOriginalIsatty) {
						ttyModule.__webPolyfillsOriginalIsatty = ttyModule.isatty;
						ttyModule.__webPolyfillsTtyFds = new Set();
						ttyModule.isatty = (fd) => {
							return ttyModule.__webPolyfillsTtyFds.has(fd) || ttyModule.__webPolyfillsOriginalIsatty(fd);
						};
					}
					const fdSet = ttyModule.__webPolyfillsTtyFds;
					fdSet.add(stdin.fd);
					fdSet.add(stdout.fd);
					fdSet.add(stderr.fd);
				}

				const unsubscribe = typeof this.shell.onTerminalResize === 'function'
					? this.shell.onTerminalResize((cols, rows) => {
						stdout.updateWindowSize(cols, rows);
						stderr.updateWindowSize(cols, rows);
						stdin.updateWindowSize(cols, rows);
					})
					: () => {};

				globalThis.process.initProcess?.({
					args: argv,
					cwd: this.shell.cwd,
					stdin,
					stdout,
					stderr,
				});

				return {
					stdin,
					stdout,
					stderr,
					dispose: () => {
						unsubscribe();
						stdin.endOfInput();
						if (ttyModule?.__webPolyfillsTtyFds) {
							const fdSet = ttyModule.__webPolyfillsTtyFds;
							fdSet.delete(stdin.fd);
							fdSet.delete(stdout.fd);
							fdSet.delete(stderr.fd);
						}
					},
				};
			}

			prepareEnvironment(runToken) {
				const processObj = globalThis.process;
				const utilModule = globalThis.coreModules?.util;
				const format = typeof utilModule?.format === 'function'
					? utilModule.format
					: (...args) => args.map((arg) => (typeof arg === 'string' ? arg : JSON.stringify(arg))).join(' ');

				const previous = {
					argv: Array.isArray(processObj?.argv) ? [...processObj.argv] : undefined,
					argc: processObj?.argc,
					env: processObj?.env ? { ...processObj.env } : undefined,
					cwd: processObj?.cwd,
					chdir: processObj?.chdir,
					console: {
						log: console.log,
						info: console.info,
						warn: console.warn,
						error: console.error,
					},
					fetch: globalThis.fetch,
					exit: processObj?.exit,
					abort: processObj?.abort,
				};

				const terminalAdapter = {
					writeStdout: (message) => this.shell.writeStdoutForRun(runToken, message),
					writeStderr: (message) => this.shell.writeStderrForRun(runToken, message),
				};
				processObj?.setTerminal?.(terminalAdapter);

				console.log = (...args) => {
					this.shell.writeStdoutForRun(runToken, `${format(...args)}\n`);
				};
				console.info = console.log;
				console.warn = (...args) => {
					this.shell.writeStderrForRun(runToken, `${format(...args)}\n`);
				};
				console.error = console.warn;

				const proxyFetch = async (url, ...args) => {
					let target = url;
					if (typeof target === 'string' && target.startsWith('https://')) {
						target = `http://127.0.0.1:8043/php-cors-proxy/cors-proxy.php?${target}`;
					}
					return previous.fetch(target, ...args);
				};
				globalThis.fetch = proxyFetch;

				processObj.exit = (code = 0) => {
					throw new ProcessExitError(code);
				};
				processObj.abort = () => {
					throw new ProcessExitError(1);
				};

				return () => {
					processObj?.setTerminal?.(null);
					console.log = previous.console.log;
					console.info = previous.console.info;
					console.warn = previous.console.warn;
					console.error = previous.console.error;
					globalThis.fetch = previous.fetch;
					processObj.exit = previous.exit;
					processObj.abort = previous.abort;
					if (previous.argv) {
						processObj.argv = [...previous.argv];
					}
					if (typeof previous.argc === 'number') {
						processObj.argc = previous.argc;
					}
					if (previous.env) {
						const env = processObj.env ?? {};
						for (const key of Object.keys(env)) {
							delete env[key];
						}
						for (const [key, value] of Object.entries(previous.env)) {
							env[key] = value;
						}
					}
					if (previous.cwd) {
						processObj.cwd = previous.cwd;
					}
					if (previous.chdir) {
						processObj.chdir = previous.chdir;
					}
				};
			}

			resetModuleState() {
				const moduleRuntime = globalThis.coreModules?.module;
				if (!moduleRuntime) {
					return;
				}
				const Module = moduleRuntime.Module;
				if (Module) {
					if (Module._cache) {
						Module._cache = Object.create(null);
					}
					if (Module._pathCache) {
						Module._pathCache = Object.create(null);
					}
				}
			}

			async runMainWithEntry(entryPath, argv) {
				/**
				 * Sometimes onExit is not called even though the process finished running.
				 * This is a quirk we need to live with until we run those Node.js processes in workers
				 * that we can actually terminate. For now, we'll assume that a runMainWithEntry call 
				 * always means the previous one is functionally finished and it's time to clean up.
				 */
				if (typeof this._pendingOnExit === 'function') {
					try {
						this._pendingOnExit();
					} catch (error) {
						console.error('Error while running pending onExit handler:', error);
					} finally {
						this._pendingOnExit = null;
					}
				}
				const runToken = Symbol('node-run');
				this.currentRunToken = runToken;
				this.shell.setActiveOutputToken(runToken);
				const { stdin, dispose } = this.createTtyStreams(argv, runToken);
				this.stdinStream = stdin;
				const cleanupEnv = this.prepareEnvironment(runToken);
				const processObj = globalThis.process;
				const onExit = () => {
					if (this._pendingOnExit !== onExit) {
						return;
					}
					if (this.currentRunToken === runToken) {
						this.currentRunToken = null;
					}
					if (this.shell.getActiveOutputToken() === runToken) {
						this.shell.setActiveOutputToken(null);
					}
					cleanupEnv();
					dispose();
					this.stdinStream = null;
					processObj.off('exit', onExit);
					this._pendingOnExit = null;
				};
				this._pendingOnExit = onExit;
				processObj.on('exit', onExit);
				this.resetModuleState();
				try {
					await runMain(entryPath);
				} catch (error) {
					console.error(error);
					if (error instanceof ProcessExitError) {
						if (error.code !== 0) {
							this.shell.writeStderr(`Process exited with code ${error.code}\n`);
						}
						return;
					}
					throw error;
				}
			}

			async runNodeCommand(args) {
				if (args.length === 0) {
					this.shell.writeStderr('node: interactive REPL is not supported yet.\n');
					return;
				}
				const [first, ...rest] = args;
				if (first === '-v' || first === '--version') {
					const version = globalThis.process?.version ?? 'v0.0.0';
					this.shell.writeStdout(`${version}\n`);
					return;
				}
				if (first.startsWith('-')) {
					this.shell.writeStderr(`node: option '${first}' is not supported yet.\n`);
					return;
				}
				const scriptPath = this.shell.resolvePath(first);
				if (!this.fs.existsSync(scriptPath)) {
					this.shell.writeStderr(`node: cannot open '${first}': No such file or directory\n`);
					return;
				}
				const argv = ['node', scriptPath, ...rest];
				await this.runMainWithEntry(scriptPath, argv);
			}

			async run(command, args) {
				this.active = true;
				try {
					if (command === 'npm') {
						const argv = ['node', '/bin/npm', ...args];
						await this.runMainWithEntry('/bin/npm', argv);
					} else {
						await this.runNodeCommand(args);
					}
				} finally {
					this.active = false;
				}
			}

			handleInput(data) {
				if (!this.active || !this.stdinStream) {
					return false;
				}
				this.stdinStream.writeFromTerminal(data);
				return true;
			}

			abort() {
				if (!this.active) {
					return;
				}
				try {
					const processObj = globalThis.process;
					if (typeof processObj?.emit === 'function') {
						processObj.emit('SIGINT');
					}
					this.stdinStream?.writeFromTerminal('\u0003');
				} catch (error) {
					this.shell.writeStderr(`Failed to send SIGINT: ${error.message}\n`);
				}
			}
		}

		class XTermShell {
			constructor(term) {
				this.term = term;
				this.buffer = '';
				this.cursor = 0;
				this.history = [];
				this.historyIndex = 0;
				this.stashedLine = '';
				this.isRunning = false;
				this.abortCurrent = null;
				this.cwd = '/bin';
				this.resizeSubscribers = new Set();
				this.activeOutputToken = null;
				this.term.onResize(({ cols, rows }) => {
					for (const handler of this.resizeSubscribers) {
						try {
							handler(cols, rows);
						} catch (error) {
							console.error('Terminal resize handler error:', error);
						}
					}
				});

				this.nodeRunner = new NodeRunner(this);
				this.syncProcessBindings();

				this.term.onData((data) => this.onData(data));
			}

			onTerminalResize(handler) {
				this.resizeSubscribers.add(handler);
				return () => {
					this.resizeSubscribers.delete(handler);
				};
			}

			syncProcessBindings() {
				const processObj = globalThis.process;
				if (!processObj) {
					return;
				}
				processObj.cwd = () => this.cwd;
				processObj.chdir = (input) => {
					this.changeDirectory(input, { fromProcess: true });
				};
			}

			start() {
				this.writeStdout('Welcome to the Node.js Web Polyfills shell. Type "help" for available commands.\n');
				this.showPrompt();
			}

			writeStdout(message) {
				this.term.write(normalizeNewlines(String(message)));
			}

			writeStderr(message) {
				this.term.write(normalizeNewlines(String(message)));
			}

			setActiveOutputToken(token) {
				this.activeOutputToken = token ?? null;
			}

			getActiveOutputToken() {
				return this.activeOutputToken;
			}

			writeStdoutForRun(token, message) {
				if (token && token !== this.activeOutputToken) {
					return;
				}
				this.writeStdout(message);
			}

			writeStderrForRun(token, message) {
				if (token && token !== this.activeOutputToken) {
					return;
				}
				this.writeStderr(message);
			}

			composePrompt() {
				return `${this.cwd}${PROMPT_SUFFIX}`;
			}

			onData(data) {
				let index = 0;
				while (index < data.length) {
					const char = data[index];

					if (this.isRunning) {
						if (char === '\u0003') {
							this.handleCtrlC();
						} else {
							this.nodeRunner.handleInput(char);
						}
						index += 1;
						continue;
					}

					if (char === '\u001b') {
						const sequence = data.slice(index, index + 3);
						if (sequence === '\u001b[A') {
							this.navigateHistory(-1);
							index += 3;
							continue;
						}
						if (sequence === '\u001b[B') {
							this.navigateHistory(1);
							index += 3;
							continue;
						}
						if (sequence === '\u001b[C') {
							this.moveCursor(1);
							index += 3;
							continue;
						}
						if (sequence === '\u001b[D') {
							this.moveCursor(-1);
							index += 3;
							continue;
						}
						index += 1;
						continue;
					}

					if (char === '\u0003') {
						this.handleCtrlC();
						index += 1;
						continue;
					}

					switch (char) {
						case '\r':
							this.handleEnter();
							break;
						case '\u0001':
							this.moveCursorToStart();
							break;
						case '\u0005':
							this.moveCursorToEnd();
							break;
						case '\u007f':
							this.handleBackspace();
							break;
						default:
							if (char >= ' ' && char !== '\u007f') {
								this.insertText(char);
							}
							break;
					}

					index += 1;
				}
			}

			moveCursor(direction) {
				if (direction === -1 && this.cursor > 0) {
					this.cursor -= 1;
					this.term.write('\u001b[D');
					return;
				}
				if (direction === 1 && this.cursor < this.buffer.length) {
					this.term.write('\u001b[C');
					this.cursor += 1;
				}
			}

			moveCursorToStart() {
				if (this.cursor > 0) {
					this.term.write(`\u001b[${this.cursor}D`);
					this.cursor = 0;
				}
			}

			moveCursorToEnd() {
				const diff = this.buffer.length - this.cursor;
				if (diff > 0) {
					this.term.write(`\u001b[${diff}C`);
					this.cursor = this.buffer.length;
				}
			}

			insertText(text) {
				if (!text) {
					return;
				}
				const before = this.buffer.slice(0, this.cursor);
				const after = this.buffer.slice(this.cursor);
				this.buffer = before + text + after;
				this.cursor += text.length;
				this.term.write(text + after);
				if (after.length) {
					this.term.write(`\u001b[${after.length}D`);
				}
			}

			handleBackspace() {
				if (this.cursor === 0) {
					return;
				}
				this.buffer = this.buffer.slice(0, this.cursor - 1) + this.buffer.slice(this.cursor);
				this.cursor -= 1;
				this.term.write('\u001b[D');
				this.term.write('\u001b[P');
			}

			handleEnter() {
				this.term.write('\r\n');
				const line = this.buffer;
				const trimmed = line.trim();

				if (!trimmed) {
					this.showPrompt();
					return;
				}

				this.addToHistory(line);
				this.isRunning = true;

				Promise.resolve(this.executeCommand(line))
					.catch((error) => {
						const message = error instanceof Error ? error.stack ?? error.message : String(error);
						this.writeStderr(`${message}\n`);
					})
					.finally(() => {
						this.finishCommand();
					});
			}

			handleCtrlC() {
				this.term.write('^C\r\n');
				if (this.isRunning) {
					if (typeof this.abortCurrent === 'function') {
						try {
							this.abortCurrent();
						} catch (error) {
							const message = error instanceof Error ? error.message : String(error);
							this.writeStderr(`${message}\n`);
						}
					}
					this.abortCurrent = null;
					this.finishCommand();
				} else {
					this.showPrompt();
				}
			}

			addToHistory(line) {
				if (!line.trim()) {
					return;
				}
				if (this.history[this.history.length - 1] !== line) {
					this.history.push(line);
				}
				this.historyIndex = this.history.length;
				this.stashedLine = '';
			}

			navigateHistory(direction) {
				if (!this.history.length) {
					return;
				}

				if (direction === -1) {
					if (this.historyIndex === this.history.length) {
						this.stashedLine = this.buffer;
					}
					if (this.historyIndex > 0) {
						this.historyIndex -= 1;
						this.buffer = this.history[this.historyIndex];
						this.cursor = this.buffer.length;
						this.renderLine();
					}
					return;
				}

				if (direction === 1) {
					if (this.historyIndex === this.history.length) {
						return;
					}
					this.historyIndex += 1;
					if (this.historyIndex === this.history.length) {
						this.buffer = this.stashedLine;
					} else {
						this.buffer = this.history[this.historyIndex];
					}
					this.cursor = this.buffer.length;
					this.renderLine();
				}
			}

			renderLine() {
				this.term.write('\u001b[?25l');
				this.term.write('\r');
				this.term.write('\u001b[2K');
				this.term.write(this.composePrompt() + this.buffer);
				const offset = this.buffer.length - this.cursor;
				if (offset > 0) {
					this.term.write(`\u001b[${offset}D`);
				}
				this.term.write('\u001b[?25h');
			}

			resetLineState() {
				this.buffer = '';
				this.cursor = 0;
				this.historyIndex = this.history.length;
				this.stashedLine = '';
			}

			showPrompt() {
				this.resetLineState();
				this.term.write(this.composePrompt());
			}

			finishCommand() {
				this.isRunning = false;
				this.abortCurrent = null;
				this.syncProcessBindings();
				this.showPrompt();
			}

			resolvePath(input) {
				if (!input || input === '.') {
					return this.cwd;
				}
				const parts = input.split('/');
				const base = input.startsWith('/') ? [] : this.cwd.split('/').filter(Boolean);
				for (const part of parts) {
					if (!part || part === '.') {
						continue;
					}
					if (part === '..') {
						base.pop();
						continue;
					}
					base.push(part);
				}
				return `/${base.join('/')}` || '/';
			}

			changeDirectory(target, { fromProcess = false } = {}) {
				const resolved = this.resolvePath(target ?? '/');
				try {
					const stats = globalFs.statSync(resolved);
					if (!stats.isDirectory()) {
						const error = new Error(`ENOTDIR: not a directory, chdir '${resolved}'`);
						error.code = 'ENOTDIR';
						throw error;
					}
					this.cwd = resolved;
					return resolved;
				} catch (error) {
					if (fromProcess) {
						throw error;
					}
					const code = error && error.code ? error.code : 'ERROR';
					if (code === 'ENOENT') {
						this.writeStderr(`cd: ${target}: No such file or directory\n`);
					} else if (code === 'ENOTDIR') {
						this.writeStderr(`cd: ${target}: Not a directory\n`);
					} else {
						this.writeStderr(`cd: ${error.message}\n`);
					}
				}
				return this.cwd;
			}

			formatFsError(prefix, target, error) {
				const code = error && error.code ? error.code : 'ERROR';
				if (code === 'ENOENT') {
					return `${prefix}: cannot access '${target}': No such file or directory`;
				}
				if (code === 'ENOTDIR') {
					return `${prefix}: cannot access '${target}': Not a directory`;
				}
				return `${prefix}: ${error.message}`;
			}

			async executeCommand(line) {
				const tokens = this.parseCommand(line);
				if (!tokens.length) {
					return;
				}

				const [command, ...args] = tokens;

				if (this.nodeRunner.isNodeCommand(command)) {
					this.abortCurrent = () => this.nodeRunner.abort();
					await this.nodeRunner.run(command, args);
					return;
				}

			switch (command) {
				case 'help':
					this.writeStdout('Available commands:\n');
					this.writeStdout('  help    Show this help message\n');
					this.writeStdout('  ls      List files in the current directory\n');
					this.writeStdout('  pwd     Print the current working directory\n');
					this.writeStdout('  cd      Change the current working directory\n');
					this.writeStdout('  mkdir   Create directories (use -p to create parents)\n');
					this.writeStdout('  node    Run a Node.js script (basic flags supported)\n');
					this.writeStdout('  npm     Run the bundled npm executable\n');
					break;
				case 'pwd':
					this.writeStdout(`${this.cwd}\n`);
					break;
				case 'cd':
					this.changeDirectory(args[0] ?? '/');
					break;
				case 'ls':
					this.handleList(args);
					break;
				case 'echo':
					this.handleEcho(args);
					break;
				case 'cat':
					this.handleCat(args);
					break;
				case 'mkdir':
					this.handleMkdir(args);
					break;
				case 'extract-targz':
					this.handleExtractTarGz(args);
					break;
				default:
					this.writeStderr(`shell: ${command}: command not found\n`);
				}
			}

			handleList(args) {
				const targets = args.length ? args : ['.'];
				for (const target of targets) {
					const resolved = this.resolvePath(target);
					try {
						const stats = globalFs.statSync(resolved);
						if (stats.isDirectory()) {
							const entries = globalFs.readdirSync(resolved).sort((a, b) => a.localeCompare(b));
							for (const entry of entries) {
								this.writeStdout(`${entry}\n`);
							}
						} else {
							this.writeStdout(`${resolved.split('/').pop()}\n`);
						}
					} catch (error) {
						this.writeStderr(`${this.formatFsError('ls', target, error)}\n`);
						if (targets.length > 1) {
							continue;
						}
					}
				}
			}

			handleMkdir(args) {
				if (!args.length) {
					this.writeStderr('mkdir: missing operand\n');
					return;
				}
				let recursive = false;
				const targets = [];
				for (const arg of args) {
					if (arg === '-p') {
						recursive = true;
						continue;
					}
					if (arg.startsWith('-')) {
						this.writeStderr(`mkdir: invalid option '${arg}'\n`);
						return;
					}
					targets.push(arg);
				}
				if (!targets.length) {
					this.writeStderr('mkdir: missing operand\n');
					return;
				}
				for (const target of targets) {
					const resolved = this.resolvePath(target);
					try {
						if (recursive) {
							globalFs.mkdirSync(resolved, { recursive: true });
						} else {
							globalFs.mkdirSync(resolved);
						}
					} catch (error) {
						const code = error && error.code ? error.code : 'ERROR';
						if (code === 'EEXIST' && recursive) {
							continue;
						}
						if (code === 'EEXIST') {
							this.writeStderr(`mkdir: ${target}: File exists\n`);
						} else if (code === 'ENOENT') {
							this.writeStderr(`mkdir: ${target}: No such file or directory\n`);
						} else if (code === 'ENOTDIR') {
							this.writeStderr(`mkdir: ${target}: Not a directory\n`);
						} else {
							this.writeStderr(`mkdir: ${error.message}\n`);
						}
					}
				}
			}

			handleCat(args) {
				if (!args.length) {
					this.writeStderr('cat: missing operand\n');
					return;
				}
				for (const arg of args) {
					const resolved = this.resolvePath(arg);
					try {
						const content = globalFs.readFileSync(resolved, 'utf-8');
						this.writeStdout(content);
					} catch (error) {
						this.writeStderr(`${this.formatFsError('cat', arg, error)}\n`);
					}
				}
			}

			handleEcho(args) {
				this.writeStdout(args.join(' '));
			}

			handleExtractTarGz(args) {
				if (!args.length) {
					this.writeStderr('extract-targz: missing operand\n');
					return;
				}
				const [source, target] = args;
				const resolvedTarget = this.resolvePath(target);
				const resolvedSource = this.resolvePath(source);
				
				globalFs.writeFileSync('/bin/extract-targz.js', `
				const { gunzip } = require('zlib');
				const fs = require('fs');
				const extracted = gunzip(fs.readFileSync(${JSON.stringify(resolvedSource)}));
				fs.writeFileSync(${JSON.stringify(resolvedTarget)}, extracted);
				`);
				
				const line = args.join(' ');
				this.executeCommand(`node /bin/extract-targz.js ${line}`);
			}

			parseCommand(line) {
				return line
					.trim()
					.split(/\s+/)
					.filter(Boolean);
			}
		}

		const terminalElement = document.getElementById('terminal');
		const terminal = new Terminal({
			cursorBlink: true,
			convertEol: true,
			fontFamily: 'Menlo, Monaco, "Courier New", monospace',
			fontSize: 14,
			cols: 200,
		});

		terminal.open(terminalElement);

		const shell = new XTermShell(terminal);
		shell.start();

		terminal.focus();
		document.addEventListener('click', () => terminal.focus());
	</script>
</body>
</html>
