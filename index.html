		function myNodeModule() {
			const fs = require('fs');
			const Module = require('module');
			const args = process.argv;

			async function doRun() {
				const npmResponse = await fetch('/npm-single.js');
				const npmCode = await npmResponse.text();

				const defaultInputResponse = await fetch('/default-input.js');
				const defaultInputCode = await defaultInputResponse.text();

				if (!fs.existsSync('/.npm')) {
					fs.mkdirSync('/.npm');
				}
				if (!fs.existsSync('/bin')) {
					fs.mkdirSync('/bin');
				}
				if (!fs.existsSync('/bin/project')) {
					fs.mkdirSync('/bin/project');
				}
				fs.writeFileSync('/bin/node', '', {
					mode: 0o755,
				});
				fs.writeFileSync('/bin/npm', npmCode, {
					mode: 0o755,
				});
				fs.writeFileSync('/bin/default-input.js', defaultInputCode);
				fs.writeFileSync(
					'/bin/project/package.json',
					JSON.stringify({
						name: 'my-test-app',
						version: '1.0.0',
						dependencies: {
							webpack: '*',
						},
					})
				);
				fs.writeFileSync(
					'/package.json',
					JSON.stringify({
						name: 'my-test-app',
						version: '1.0.0',
						dependencies: {
							webpack: '*',
						},
					})
				);

				const command = args[0];
				if (args[1] === 'npm') {
					Module.runMain({ code: npmCode, path: args[0] });
				} else if (command === 'ls') {
					const files = fs.readdirSync(args[1] || process.cwd()).sort();
					process.stdout.write('\n' + files.join('\n') + '\n');
					// process.exit(0);
				} else if (command === 'pwd') {
					process.stdout.write('\n' + process.cwd() + '\n');
					// process.exit(0);
				} else {
					process.stderr.write('\ncommand not found: ' + command + '\n');
					// process.exit(1);
				}
			}
			doRun();
		}

		try {
			Module.runMain({
				code: `(${myNodeModule})()`,
				path: 'main-module.js',
			});
		} catch (e) {
			if (e instanceof Error && e.message.startsWith('process.exit(')) {
				// This is a normal exit, captured by our process.exit polyfill.
			} else {

				console.error('Worker error:', e);
				const errorMessage = e instanceof Error ? e.stack : String(e);
				postToTerminal(`\r\n\x1b[31m${errorMessage}\x1b[0m`);
			}
		} finally {
