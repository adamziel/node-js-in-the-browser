<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Node.js Web Polyfills</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			height: 100%;
			margin: 0;
			background: #1e1e1e;
		}

		#terminal {
			height: 100%;
			width: 100%;
		}
	</style>
</head>
<body>
	<div id="terminal"></div>

	<script type="module">
		import { Terminal } from 'https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm';

		const PROMPT = '$ ';

		class XTermShell {
			constructor(term) {
				this.term = term;
				this.promptText = PROMPT;
				this.buffer = '';
				this.cursor = 0;
				this.history = [];
				this.historyIndex = 0;
				this.stashedLine = '';
				this.isRunning = false;
				this.abortCurrent = null;

				this.term.onData((data) => this.onData(data));
			}

			start() {
				this.term.writeln('Welcome to the Node.js Web Polyfills shell. Type "help" to learn more.');
				this.showPrompt();
			}

			onData(data) {
				let index = 0;
				while (index < data.length) {
					const char = data[index];

					if (char === '\u001b') {
						const sequence = data.slice(index, index + 3);
						if (!this.isRunning) {
							if (sequence === '\u001b[A') {
								this.navigateHistory(-1);
								index += 3;
								continue;
							}
							if (sequence === '\u001b[B') {
								this.navigateHistory(1);
								index += 3;
								continue;
							}
							if (sequence === '\u001b[C') {
								this.moveCursor(1);
								index += 3;
								continue;
							}
							if (sequence === '\u001b[D') {
								this.moveCursor(-1);
								index += 3;
								continue;
							}
						}
						index += 1;
						continue;
					}

					index += 1;

					if (char === '\u0003') {
						this.handleCtrlC();
						continue;
					}

					if (this.isRunning) {
						continue;
					}

					switch (char) {
						case '\r':
							this.handleEnter();
							break;
						case '\u0001': // Ctrl+A
							this.moveCursorToStart();
							break;
						case '\u0005': // Ctrl+E
							this.moveCursorToEnd();
							break;
						case '\u007f': // Backspace
							this.handleBackspace();
							break;
						default:
							if (char >= ' ' && char !== '\u007f') {
								this.insertText(char);
							}
							break;
					}
				}
			}

			moveCursor(direction) {
				if (direction === -1 && this.cursor > 0) {
					this.cursor -= 1;
					this.term.write('\u001b[D');
					return;
				}
				if (direction === 1 && this.cursor < this.buffer.length) {
					this.term.write('\u001b[C');
					this.cursor += 1;
				}
			}

			moveCursorToStart() {
				if (this.cursor > 0) {
					this.term.write(`\u001b[${this.cursor}D`);
					this.cursor = 0;
				}
			}

			moveCursorToEnd() {
				const diff = this.buffer.length - this.cursor;
				if (diff > 0) {
					this.term.write(`\u001b[${diff}C`);
					this.cursor = this.buffer.length;
				}
			}

			insertText(text) {
				if (!text) {
					return;
				}
				const before = this.buffer.slice(0, this.cursor);
				const after = this.buffer.slice(this.cursor);
				this.buffer = before + text + after;
				this.cursor += text.length;
				this.term.write(text + after);
				if (after.length) {
					this.term.write(`\u001b[${after.length}D`);
				}
			}

			handleBackspace() {
				if (this.cursor === 0) {
					return;
				}
				this.buffer = this.buffer.slice(0, this.cursor - 1) + this.buffer.slice(this.cursor);
				this.cursor -= 1;
				this.term.write('\u001b[D');
				this.term.write('\u001b[P');
			}

			handleEnter() {
				this.term.write('\r\n');
				const line = this.buffer;
				const trimmed = line.trim();

				if (!trimmed) {
					this.showPrompt();
					return;
				}

				this.addToHistory(line);
				this.isRunning = true;

				Promise.resolve(this.executeCommand(line))
					.catch((error) => {
						const message = error instanceof Error ? error.message : String(error);
						this.term.writeln(`Error: ${message}`);
					})
					.finally(() => {
						this.finishCommand();
					});
			}

			handleCtrlC() {
				this.term.write('^C\r\n');
				if (this.isRunning) {
					if (typeof this.abortCurrent === 'function') {
						try {
							this.abortCurrent();
						} catch (error) {
							const message = error instanceof Error ? error.message : String(error);
							this.term.writeln(`Error: ${message}`);
						}
					}
					this.abortCurrent = null;
					this.finishCommand();
				} else {
					this.showPrompt();
				}
			}

			addToHistory(line) {
				if (!line.trim()) {
					return;
				}
				if (this.history[this.history.length - 1] !== line) {
					this.history.push(line);
				}
				this.historyIndex = this.history.length;
				this.stashedLine = '';
			}

			navigateHistory(direction) {
				if (!this.history.length) {
					return;
				}

				if (direction === -1) {
					if (this.historyIndex === this.history.length) {
						this.stashedLine = this.buffer;
					}
					if (this.historyIndex > 0) {
						this.historyIndex -= 1;
						this.buffer = this.history[this.historyIndex];
						this.cursor = this.buffer.length;
						this.renderLine();
					}
					return;
				}

				if (direction === 1) {
					if (this.historyIndex === this.history.length) {
						return;
					}
					this.historyIndex += 1;
					if (this.historyIndex === this.history.length) {
						this.buffer = this.stashedLine;
					} else {
						this.buffer = this.history[this.historyIndex];
					}
					this.cursor = this.buffer.length;
					this.renderLine();
				}
			}

			renderLine() {
				this.term.write('\u001b[?25l');
				this.term.write('\r');
				this.term.write('\u001b[2K');
				this.term.write(this.promptText + this.buffer);
				const offset = this.buffer.length - this.cursor;
				if (offset > 0) {
					this.term.write(`\u001b[${offset}D`);
				}
				this.term.write('\u001b[?25h');
			}

			resetLineState() {
				this.buffer = '';
				this.cursor = 0;
				this.historyIndex = this.history.length;
				this.stashedLine = '';
			}

			showPrompt() {
				this.resetLineState();
				this.term.write(this.promptText);
			}

			finishCommand() {
				this.isRunning = false;
				this.abortCurrent = null;
				this.showPrompt();
			}

			async executeCommand(line) {
				const tokens = this.parseCommand(line);
				if (!tokens.length) {
					return;
				}

				const [command] = tokens;
				switch (command) {
					case 'help':
						this.term.writeln('Available commands:');
						this.term.writeln('  help    Show this help message');
						break;
					default:
						this.term.writeln(`shell: ${command}: command not found`);
				}
			}

			parseCommand(line) {
				return line
					.trim()
					.split(/\s+/)
					.filter(Boolean);
			}
		}

		const terminalElement = document.getElementById('terminal');
		const terminal = new Terminal({
			cursorBlink: true,
			convertEol: true,
			fontFamily: 'Menlo, Monaco, "Courier New", monospace',
			fontSize: 14,
		});

		terminal.open(terminalElement);

		const shell = new XTermShell(terminal);
		shell.start();

		terminal.focus();
		document.addEventListener('click', () => terminal.focus());
	</script>
</body>
</html>
