<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Node.js Web Polyfills</title>
</head>
<body>
	<h1>Node.js Web Polyfills</h1>
	
	<script type="module">
		import { runMain } from "./client-boot.js";

		function myNodeModule() {
			const buffer = require("buffer");
			globalThis.Buffer = buffer.Buffer;

			const fs = require('fs');
			const Module = require('module');
			console.log(Module);
			// works!
			// process.argv = ["node", "npm"];

			// works!
			// process.argv = ["node", "npm", "init"];

			process.argv = ["node", "npm", "install"];
			process.argc = process.argv.length;
			const args = process.argv;

			async function doRun() {
				const npmResponse = await fetch('/npm/npm-single.js');
				const npmCode = await npmResponse.text();

				const defaultInputResponse = await fetch('/npm/default-input.js');
				const defaultInputCode = await defaultInputResponse.text();

				fs.mkdirSync('/home/user/.npm/_cacache', { recursive: true });
				if (!fs.existsSync('/.npm')) {
					fs.mkdirSync('/.npm');
				}
				if (!fs.existsSync('/bin')) {
					fs.mkdirSync('/bin');
				}
				if (!fs.existsSync('/bin/project')) {
					fs.mkdirSync('/bin/project');
				}
				fs.writeFileSync('/bin/node', '', {
					mode: 0o755,
				});
				fs.writeFileSync('/bin/npm', npmCode, {
					mode: 0o755,
				});
				fs.writeFileSync('/bin/default-input.js', defaultInputCode);
				fs.writeFileSync(
					'/bin/package.json',
					JSON.stringify({
						name: 'my-test-app',
						version: '1.0.0',
						dependencies: {
							leftpad: '*',
						},
					})
				);

				const previousFetch = globalThis.fetch;
				globalThis.fetch = async (url, ...args) => {
					if (typeof url === 'string' && url.startsWith('https://')) {
						url = `http://127.0.0.1:8974/?${url}`;
					}

					let result = await previousFetch(url, ...args);

					// Strip content-encoding header to prevent npm from trying
					// to decompress the already-decompressed fetch() response.
					// if (result.headers.has('content-encoding')) {
					// 	const newHeaders = new Headers(result.headers);
					// 	newHeaders.delete('content-encoding');
					// 	newHeaders.set('content-length', 1000);
						
					// 	const [s1, s2] = await result.body.tee();
					// 	result = new Response(s1, {
					// 		status: result.status,
					// 		statusText: result.statusText,
					// 		headers: newHeaders
					// 	});
					// 	console.log(result.body)
					// }
					return result;
				};

				const command = args[0];
				if (args[1] === 'npm') {
					Module.Module.runMain({ code: npmCode, path: args[0] });
				} else if (command === 'ls') {
					const files = fs.readdirSync(args[1] || process.cwd()).sort();
					process.stdout.write('\n' + files.join('\n') + '\n');
					// process.exit(0);
				} else if (command === 'pwd') {
					process.stdout.write('\n' + process.cwd() + '\n');
					// process.exit(0);
				} else {
					process.stderr.write('\ncommand not found: ' + command + '\n');
					// process.exit(1);
				}
			}
			doRun();
		}

		try {
			runMain({
				code: `(${myNodeModule})()`,
				path: 'main-module.js',
			});
		} catch (e) {
			if (e instanceof Error && e.message.startsWith('process.exit(')) {
				// This is a normal exit, captured by our process.exit polyfill.
			} else {
				// This is an unexpected error.
				console.error('Worker error:', e);
				const errorMessage = e instanceof Error ? e.stack : String(e);
				console.log(`\r\n\x1b[31m${errorMessage}\x1b[0m`);
			}
		} finally {
			self.postMessage({ type: 'status', data: 'finished' });
		}
	</script>
</body>
</html>
