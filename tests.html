<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/mocha/mocha.css" />
	<title>Node.js Web Polyfills</title>
</head>
<body>
	<h1>Test Suite</h1>
    <div id="mocha"></div>
	
	<script src="https://unpkg.com/chai@4/chai.js"></script>
    <script src="https://unpkg.com/mocha/mocha.js"></script>
	<script class="mocha-init">
		mocha.setup({
			ui: 'bdd',
			rootHooks: {
				beforeAll: () => {
					console.log('beforeAll');
				},
				afterAll: () => {
					console.log('afterAll');
				},
			}
		});
		mocha.checkLeaks();
	</script>
	<script type="module">
		import { runMain } from "./client-boot.js";

		const testSuiteFilenames = [
			'./tests/fs.js',
		];
		const testSuites = {};
		for (const filename of testSuiteFilenames) {
			const response = await fetch(filename);
			const code = await response.text();
			testSuites[filename] = code;
		}

		try {
			for (const filename of testSuiteFilenames) {
				const code = testSuites[filename];
				runMain({
					code,
					path: filename,
				});
			}
		} catch (e) {
			if (e instanceof Error && e.message.startsWith('process.exit(')) {
				// This is a normal exit, captured by our process.exit polyfill.
			} else {
				// This is an unexpected error.
				console.error('Worker error:', e);
				const errorMessage = e instanceof Error ? e.stack : String(e);
				console.log(`\r\n\x1b[31m${errorMessage}\x1b[0m`);
			}
		} finally {
			self.postMessage({ type: 'status', data: 'finished' });
		}

		console.log('running mocha');
      	mocha.run();
    </script>
</body>
</html>
