<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Node.js Web Polyfills</title>
</head>
<body>
	<h1>Node.js Web Polyfills</h1>
	
	<script type="module">
		import { runMain } from "./client-boot.js";
		window.runMain = runMain;

		// Initialize the filesystem (if needed)
		globalFs.mkdirSync('/home/user/.npm/_cacache', { recursive: true });
		if (!globalFs.existsSync('/.npm')) {
			globalFs.mkdirSync('/.npm');
		}
		if (!globalFs.existsSync('/bin')) {
			globalFs.mkdirSync('/bin');
		}
		if (!globalFs.existsSync('/bin/project')) {
			globalFs.mkdirSync('/bin/project');
		}
		globalFs.writeFileSync('/bin/node', '', {
			mode: 0o755,
		});
		const npmResponse = await fetch('/npm/npm-single.js');
		const npmCode = await npmResponse.text();

		const defaultInputResponse = await fetch('/npm/default-input.js');
		const defaultInputCode = await defaultInputResponse.text();
		globalFs.writeFileSync('/bin/npm', npmCode, {
			mode: 0o755,
		});
		globalFs.writeFileSync('/bin/default-input.js', defaultInputCode);
		globalFs.writeFileSync(
			'/bin/package.json',
			JSON.stringify({
				name: 'my-test-app',
				version: '1.0.0',
				dependencies: {
					// leftpad: '*',
					webpack: '*',
					"webpack-cli": '*',
					'function-bind': '*',
				},
			})
		);
		globalFs.writeFileSync('/bin/webpack.config.js', `module.exports = {
			entry: '/bin/index.js',
			output: {
				filename: 'bundle.js',
			},
		}`);
		globalFs.writeFileSync('/bin/index.js', 'console.log("Hello, world!");');

		function myNodeModule() {
			process.initArgv(["node", "webpack", "build"])

			const args = process.argv;
			async function doRun() {
				const previousFetch = globalThis.fetch;
				globalThis.fetch = async (url, ...args) => {
					if (typeof url === 'string' && url.startsWith('https://')) {
						url = `http://127.0.0.1:8043/php-cors-proxy/cors-proxy.php?${url}`;
					}
					return await previousFetch(url, ...args);
				};

				try {
					const fs = require('fs');
					const command = args[0];
					if (args[1] === 'npm') {
						fs.mkdirSync('/bin/node_modules/node-gyp/bin', { recursive: true });
						fs.writeFileSync('/bin/node_modules/node-gyp/package.json', '{}');
						fs.writeFileSync('/bin/node_modules/node-gyp/bin/node-gyp.js', '');
						if (!fs.existsSync('/bin/node_modules/webpack')) {
							require('/bin/npm')
						} else {
							console.log('webpack already installed (cached filesystem used)');
						}
					} else if (command === 'ls') {
						const files = fs.readdirSync(args[1] || process.cwd()).sort();
						process.stdout.write('\n' + files.join('\n') + '\n');
						// process.exit(0);
					} else if (command === 'pwd') {
						process.stdout.write('\n' + process.cwd() + '\n');
						// process.exit(0);
					} else {
						process.stderr.write('\ncommand not found: ' + command + '\n');
						// process.exit(1);
					}
				} catch(e) {
				}
				setTimeout(() => {
					console.log('openFiles');
					const openFiles = globalFs.openFiles;
					for (const [key, value] of openFiles.entries()) {
						new TextDecoder().decode(value.node.content)
					}
				}, 8000);
			}
			doRun();
		}

		try {
			runMain({
				code: `(${myNodeModule})()`,
				path: 'main-module.js',
			});
		} catch (e) {
			if (e instanceof Error && e.message.startsWith('process.exit(')) {
				// This is a normal exit, captured by our process.exit polyfill.
			} else {
				// This is an unexpected error.
				console.error('Worker error:', e);
				const errorMessage = e instanceof Error ? e.stack : String(e);
				console.log(`\r\n\x1b[31m${errorMessage}\x1b[0m`);
			}
		} finally {
			self.postMessage({ type: 'status', data: 'finished' });
		}
	</script>

</body>
</html>
